<div
  class="bg-white rounded-xl shadow-sm hover:shadow-md transition overflow-hidden flex flex-col h-full"
>
  <!-- IMAGE -->
  <div class="h-48 w-full overflow-hidden bg-gray-100">
    <img
      *ngIf="book.imageUrl; else noImage"
      [src]="book.imageUrl"
      alt="{{ book.title }}"
      class="w-full h-full object-cover"
    />
    <ng-template #noImage>
      <div class="w-full h-full flex items-center justify-center text-gray-400 text-sm">
        No Image
      </div>
    </ng-template>
  </div>

  <!-- CONTENT -->
  <div class="p-4 flex flex-col justify-between flex-grow">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 leading-tight">
        {{ book.title }}
      </h3>

      <p class="text-sm text-gray-500">{{ book.author }}</p>

      <p class="text-xs text-gray-400 mt-1">
        {{ book.year ?? '—' }}
      </p>

      <p *ngIf="book.description" class="mt-3 text-sm text-gray-600 line-clamp-3">
        {{ book.description }}
      </p>
    </div>

    <!-- ACTIONS -->
    <div class="mt-4 flex items-center justify-end gap-2">
      <button
        (click)="edit.emit(book)"
        class="px-3 py-1.5 text-sm border border-gray-300 rounded-md hover:bg-gray-100 transition"
      >
        Edit
      </button>

      <button
        (click)="delete.emit(book)"
        class="px-3 py-1.5 text-sm border border-red-300 text-red-600 rounded-md hover:bg-red-50 transition"
      >
        Delete
      </button>
    </div>
  </div>
</div>
