<section class="bg-white rounded-xl shadow-sm p-6 space-y-4" [formGroup]="group">
  <h2 class="text-xl font-semibold">Client Information</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Name</label>
      <input type="text" formControlName="name" class="w-full rounded-lg border px-3 py-2" />
      <p
        *ngIf="group.get('name')?.touched && group.get('name')?.invalid"
        class="text-sm text-red-600 mt-1"
      >
        Name is required
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Email</label>
      <input type="email" formControlName="email" class="w-full rounded-lg border px-3 py-2" />
      <p
        *ngIf="group.get('email')?.touched && group.get('email')?.invalid"
        class="text-sm text-red-600 mt-1"
      >
        Enter a valid email
      </p>
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">Phone</label>
      <input type="text" formControlName="phone" class="w-full rounded-lg border px-3 py-2" />
    </div>
  </div>
</section>
