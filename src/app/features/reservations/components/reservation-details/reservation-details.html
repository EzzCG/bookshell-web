<section class="bg-white rounded-xl shadow-sm p-6 space-y-4" [formGroup]="group">
  <h2 class="text-xl font-semibold">Reservation Details</h2>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    <div>
      <label class="block text-sm font-medium mb-1">Start Date</label>
      <input type="date" formControlName="startDate" class="w-full rounded-lg border px-3 py-2" />
    </div>

    <div>
      <label class="block text-sm font-medium mb-1">End Date</label>
      <input type="date" formControlName="endDate" class="w-full rounded-lg border px-3 py-2" />
    </div>

    <div class="md:col-span-2">
      <label class="block text-sm font-medium mb-1">Notes</label>
      <textarea
        formControlName="notes"
        rows="3"
        class="w-full rounded-lg border px-3 py-2"
      ></textarea>
    </div>
  </div>
</section>
