<div class="max-w-md mx-auto p-6">
  <h2 class="text-2xl font-semibold mb-4">Sign in</h2>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>Email</label>
    <input formControlName="email" type="email" class="w-full p-2 border rounded mb-3" />
    <div
      *ngIf="form.controls.email.touched && form.controls.email.invalid"
      class="text-sm text-red-600"
    >
      Please enter a valid email.
    </div>

    <label>Password</label>
    <input formControlName="password" type="password" class="w-full p-2 border rounded mb-3" />
    <div
      *ngIf="form.controls.password.touched && form.controls.password.invalid"
      class="text-sm text-red-600"
    >
      Password is required.
    </div>

    <button
      type="submit"
      class="w-full p-2 rounded bg-indigo-600 text-white"
      [disabled]="loading()"
    >
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</div>
