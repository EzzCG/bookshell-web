<!-- app-shell.component.html -->
<!-- outer: 3 columns layout (mobile -> stacked, lg+ -> sidebars visible) -->
<div class="min-h-screen container mx-auto px-4 py-6 w-full">
  <!-- make a 3-col grid on lg and above; single column on small screens -->
  <div class="grid grid-cols-1 lg:grid-cols-[240px_1fr_320px] gap-6 min-h-screen">
    <!-- LEFT sidebar (hidden on small screens) -->
    <aside class="hidden lg:block">
      <app-left-sidebar></app-left-sidebar>
    </aside>

    <!-- CENTER column: topbar, page content, footer stacked vertically -->
    <section class="flex flex-col min-h-screen bg-gray-100 rounded-xl shadow-xl">
      <!-- Topbar sits inside the middle column -->
      <header class="w-full">
        <app-topbar></app-topbar>
      </header>

      <!-- main expands to fill available vertical space between topbar+footer -->
      <main class="flex-1 p-6 overflow-auto">
        <router-outlet></router-outlet>
      </main>

      <!-- footer inside the middle column -->
      <footer class="w-full">
        <app-footer></app-footer>
      </footer>
    </section>

    <!-- RIGHT sidebar (hidden on smaller screens; visible xl if you prefer) -->
    <aside class="hidden xl:block">
      <app-right-sidebar></app-right-sidebar>
    </aside>
  </div>
</div>
