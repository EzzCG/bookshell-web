name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build app
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      ANGULAR_CONFIGURATION: ${{ vars.ANGULAR_CONFIGURATION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular app
        run: npm run build -- --configuration $ANGULAR_CONFIGURATION
      - name: Simulate deploy
        run: echo "$ANGULAR_CONFIGURATION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: production

    permissions:
      contents: read

    env:
      APP_NAME: ${{ vars.APP_NAME }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
      DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: angular-dist
          path: dist

      - name: Show artifact contents
        run: ls -R dist

      - name: Simulate deploy
        run: |
          echo "Deploying $APP_NAME to $DEPLOY_TARGET"
          echo "This is where the real hosting command will go."
